<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SoulPaws - Cadastro</title>
    <link rel="icon" href="assets/logo/Soul (1).png">
    <link rel="stylesheet" href="style/cadastro.css">
</head>

<body>
    <div class="container reversed">

        <section class="form">
            <div class="form-caixa">
                <p class="subtitulo">Informe os seus dados abaixo</p>

                <div action="formCadastro.html">
                    <div class="input-grupo">
                        <label>Nome Completo</label>
                        <input oninput="tamanhoNome()" type="text" id="ipt_nome" placeholder="Nome completo">
                        <div id="div_nome"></div>
                    </div>

                    <div class="input-grupo">
                        <label>Nome de usuario</label>
                        <input type="text" id="ipt_nomeUsuario" placeholder="Nome de usuario">
                    </div>

                    <div class="input-grupo">
                        <label>E-mail</label>
                        <input type="email" id="ipt_email" placeholder="nome@email.com">
                    </div>

                    <div class="input-grupo">
                        <label>CPF</label>
                        <input oninput="tamanhoCpf()" type="number" id="ipt_cpf" placeholder="ex:999999999-70">
                        <div id="div_cpf"></div>
                    </div>

                    <div class="input-grupo">
                        <label>Senha</label>
                        <div class="senha">
                            <input type="password" id="ipt_senha" oninput="validar()">
                            <span onclick="visualizar()" style="cursor: pointer;">
                                <img id="olho" src="/assets/icons/eye.png"></span>
                        </div>
                        <p style="color: tomato;" id="caractereEspecial">X Não possui caractere especial</p>
                        <p style="color: tomato;" id="letraMaiuscula">X Não possui letra maiúscula</p>
                        <p style="color: tomato;" id="letraMinuscula">X Não possui letra minúscula</p>
                        <p style="color: tomato;" id="tamanho">X Não possui mais de 8 caracteres</p>

                    </div>

                    <div class="input-grupo">
                        <label>Confirmar Senha</label>
                        <div class="senha">
                            <input type="password" id="ipt_senhaDnv" oninput="confirmar()">
                            <span onclick="visualizarDnv()" style="cursor: pointer;">
                                <img id="olhoDnv" src="/assets/icons/eye.png"></span>
                        </div>
                        <div id="div_erro"></div>
                    </div>
                    <button class="btn-cadastrar" onclick="dadosVazios()">
                        Proximo
                        <img src="/assets/icons/seta.png" alt="" width="20">
                    </button>
                </div>
            </div>
        </section>

        <section class="banner">
            <div class="banner-conteudo">
                <h1><b>Será um prazer te <br> ter em nossa <br> <span style="color: #ff1251;">comunidade</b></span></h1>
            </div>
        </section>
    </div>
    <script>
        function confirmar() {
            let senha = ipt_senha.value;
            let confirmarSenha = ipt_senhaDnv.value;
            let mensagem = ""

            if (senha === confirmarSenha) {
                mensagem += `<span style="color: green;">As senhas coincidem</span>`
            } else {
                mensagem += `<span style="color: tomato;">As senhas não coincidem</span>`
            }
            div_erro.innerHTML = mensagem
        }

        function visualizar() {
            if (ipt_senha.type == 'password') {
                ipt_senha.type = 'text'
                olho.src = "/assets/icons/hidden (1).png"
            } else {
                ipt_senha.type = 'password'
                olho.src = "/assets/icons/eye.png"
            }
        }

        function visualizarDnv() {

            if (ipt_senhaDnv.type == 'password') {
                ipt_senhaDnv.type = 'text'
                olhoDnv.src = "/assets/icons/hidden (1).png"
            } else {
                ipt_senhaDnv.type = 'password'
                olhoDnv.src = "/assets/icons/eye.png"
            }
        }


        function validar() {
            let senha = ipt_senha.value;

            let especiais = ["!", "@", "#", "$", "%", "&", "*"];

            let temEspecial = false;
            let temMaiuscula = false;
            let temMinuscula = false;

            for (let i = 0; i < senha.length; i++) {
                let letra = senha[i];

                if (letra >= 'A' && letra <= 'Z') {
                    temMaiuscula = true;
                }

                if (letra >= 'a' && letra <= 'z') {
                    temMinuscula = true;
                }

                for (let j = 0; j < especiais.length; j++) {
                    if (letra == especiais[j]) {
                        temEspecial = true;
                    }
                }
            }

            if (senha.length > 8) {
                tamanho.innerHTML = " ✓ Possui mais de 8 caracteres";
                tamanho.style.color = "yellowgreen";
            } else {
                tamanho.innerHTML = "X Não possui mais de 8 caracteres";
                tamanho.style.color = "tomato";
            }

            if (temEspecial) {
                caractereEspecial.innerHTML = " ✓ Possui caractere especial";
                caractereEspecial.style.color = "yellowgreen";
            } else {
                caractereEspecial.innerHTML = "X Não possui caractere especial";
                caractereEspecial.style.color = "tomato";
            }

            if (temMaiuscula) {
                letraMaiuscula.innerHTML = " ✓ Possui letra maiúscula";
                letraMaiuscula.style.color = "yellowgreen";
            } else {
                letraMaiuscula.innerHTML = "X Não possui letra maiúscula";
                letraMaiuscula.style.color = "tomato";
            }

            if (temMinuscula) {
                letraMinuscula.innerHTML = " ✓ Possui letra minúscula";
                letraMinuscula.style.color = "yellowgreen";
            } else {
                letraMinuscula.innerHTML = "X Não possui letra minúscula";
                letraMinuscula.style.color = "tomato";
            }
        }


        function tamanhoNome() {
            let nome = ipt_nome.value;
            let mensagem = ""

            if (nome.length < 1) {
                mensagem += `  <span style="color: tomato;">Nome invalido</span>`
            }
            div_nome.innerHTML = mensagem

        }

        function tamanhoCpf() {
            let cpf = ipt_cpf.value;
            let mensagem = ""

            if (cpf.length < 11) {
                mensagem += `  <span style="color: tomato;">CPF inválido</span>`
            }
            div_cpf.innerHTML = mensagem
        }

        function dadosVazios() {
            let email = ipt_email.value;
            let nomeCompleto = ipt_nome.value;
            let nomeUsuario = ipt_nomeUsuario.value
            let cpf = ipt_cpf.value;
            let senha = ipt_senha.value;

            if (email == "" || nomeUsuario == "" || nomeCompleto == "" || cpf == "" || senha == "") {
                alert("Preencha os campos corretamente")
            } else {

                let dados = {
                    nome: nomeCompleto,
                    nomeUsuario: nomeUsuario,
                    email: email,
                    cpf: cpf,
                    senha: senha
                }
                fetch('/usuarios/cadastrar', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(dados)
                })
                    .then(res => {
                        if (res.ok)
                            return res.json()
                    }).then(resultado => {
                        console.log(resultado)
                        localStorage.setItem("fkUsuario", resultado.insertId)
                        window.location.href = "formCadastro.html"
                    })
                    .catch(error => console.error('Erro:', error));
            }
        }
    </script>
</body>


</html>
