<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SoulPaws - Cadastro</title>
    <link rel="icon" href="assets/logo/Soul (1).png">
    <link rel="stylesheet" href="/public/style/cadastro.css">
</head>

<body>
    <div class="main-container reversed">

        <section class="form-side">
            <div class="form-box">
                <div class="logo">
                    <a href="index.html">
                        <img src="/public/assets/logo/Soul (1).png" alt="">
                    </a>
                </div>
                <p class="subtitle">Informe os seus dados abaixo</p>

                <div action="formCadastro.html">
                    <div class="input-group">
                        <label>Nome Completo</label>
                        <input type="text" id="ipt_nome" placeholder="Nome completo">
                    </div>

                    <div class="input-group">
                        <label>E-mail</label>
                        <input type="email" id="ipt_email" placeholder="nome@email.com">
                    </div>

                    <div class="input-group">
                        <label>CPF</label>
                        <input type="number" id="ipt_cpf" placeholder="ex:999999999-70">
                    </div>

                    <div class="input-group">
                        <label>Senha</label>
                        <input type="password" id="ipt_senha" placeholder="*************">

                    </div>

                    <div class="input-group">
                        <label>Confirmar Senha</label>
                        <div class="password-wrapper">
                            <input type="password" id="ipt_senhaDnv" placeholder="*********" oninput="confirmar()">
                        </div>
                    </div>
                    <button class="btn-primary" onclick="dadosVazios()">
                        Proximo
                        <img src="/public/assets/icons/seta.png" alt="" width="20">
                    </button>
                </div>
                <div id="div_erro"></div>
            </div>
        </section>

        <section class="banner-side">
            <div class="overlay"></div>
            <div class="banner-content">
                <h1><b>Será um prazer te <br> ter em nossa <br> <span style="color: #ff1251;">comunidade</b></span></h1>
            </div>
        </section>
    </div>
</body>

<script>
    function confirmar() {
        let senha = ipt_senha.value;
        let confirmarSenha = ipt_senhaDnv.value;
        let mensagem = ""

        if (senha === confirmarSenha) {
            mensagem += `<span style="color: green;">As senhas coincidem</span>`
        } else {
            mensagem += `<span style="color: orangered;">As senhas não coincidem</span>`
        }
        div_erro.innerHTML = mensagem
    }

    function dadosVazios() {
        let email = ipt_email.value;
        let nomeCompleto = ipt_nome.value;
        let cpf = ipt_cpf.value;
        let senha = ipt_senha.value;

        if (email == "" || nomeCompleto == "" || cpf == "") {
            alert("Preencha os campos corretamente")
        } else {
            let dados = {
                nome: nomeCompleto,
                email: email,
                cpf: cpf,
                senha: senha
            }

            fetch('http://localhost:3333/usuarios/cadastrar', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(dados)
            })
                .then(res => {
                    if(res.ok){
                        window.location.href = "/public/formCadastro.html"
                    }
                })
                .catch(error => console.error('Erro:', error));
        }
    }
</script>

</html>
