<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SoulPaws - Postagem</title>
    <link rel="stylesheet" href="style/postagem.css">
    <link rel="icon" href="assets/logo/Soul (1).png">
</head>

<body onload="carregarPostagem()">
    <div class="logo">
        <img src="assets/logo/Soul.png" alt="Logo SoulPaws">
    </div>
    <header>
        <nav class="navbar">
            <div class="left">
                <a href="forum.html" class="ativo">FORUM</a>
                <a href="diarioEmocoes.html">EMOÇÕES</a>
                <a href="perfil.html">PERFIL</a>
                <a href="dashboard.html">DASHBOARD</a>
                <a href="index.html">SAIR</a>

            </div>
        </nav>
    </header>

    <main class="principal-postagem">

        <div class="container-postagem">

            <div class="cabecalho-postagem">
            <label class="rotulo-postagem">Nome do usuário</label>
                <span class="nome-autor" id="nomeAutor"></span>
            </div>
        </div>

        <div class="campo-postagem">
            <label class="rotulo-postagem">Titulo da postagem</label>
            <input class="caixa-titulo" id="titulo"></input>
        </div>

        <div class="campo-postagem">
            <label class="rotulo-postagem">Descrição da postagem</label>
            <input class="caixa-descricao" id="descricao"></input>
        </div>

        <div class="linha-comentarios">
            <label class="rotulo-postagem">Comentarios</label>
            <button id="comentario" class="botao-comentario"> + POSTAR COMENTARIO</button>
        </div>

        <div id="container-comentarios">
        </div>

        </div>

    </main>
</body>
<script>
    function carregarPostagem() {
        let url = window.location.search;
        let idPost = url.split('=')[1];

        fetch(`http://localhost:3333/postagem/${idPost}`, {
            method: 'GET',
            headers: { 'Content-Type': 'application/json' }
        })
            .then(res => {
                if (res.status === 204);
                return res.json();
            })
            .then(post => {
                if (post) {
                    let titulo = document.getElementById('titulo');
                    let descricao = document.getElementById('descricao');
                    let botao = document.getElementById('comentario');

                    titulo.value = post.titulo;
                    descricao.value = post.post;
                    botao.onclick = function () {
                        window.location.href = `novoPost.html?idPost=${idPost}`;
                    }

                    document.getElementById('nomeAutor').textContent = post.nomeUsuario;
                }
            })
            .catch(error => console.error('Erro:', error));

        fetch(`http://localhost:3333/postagem/${idPost}/comentarios`, {
            method: 'GET',
            headers: { 'Content-Type': 'application/json' }
        })
            .then(res => {
                if (res.status === 204) return [];
                return res.json();
            })
            .then(comentarios => {
                let container = document.getElementById('container-comentarios');
                container.innerHTML = '';

                for (let i = 0; i < comentarios.length; i++) {
                    let comentario = comentarios[i];

                    container.innerHTML += `
        <div class="item-comentario">
            <div class="info-comentario">
                <div class="nome-comentario">${comentario.nomeUsuario}</div>
                <div>${comentario.post}</div>
            </div>
        </div>
    `;
                }
            })
            .catch(error => console.error('Erro:', error));
    }
</script>

</html>
