<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SouPaws - Formulário de Cadastro</title>
    <link rel="icon" href="assets/logo/Soul (1).png">
    <link rel="stylesheet" href="/public/style/formCadastro.css">
</head>
<body>
     <div class="main-container">
        <section class="banner-side">
            <div class="banner-content">
                <h1>Nos conte mais sobre <span style="color: #ff1251;">você!</span></h1>
            </div>
        </section>

        <section class="form-side">
            <div class="form-box">
                <div class="logo">
                    <a href="index.html">
                        <img src="/public/assets/logo/Soul (1).png" alt="">
                    </a>
                </div>
                <form>
                    <div class="input-group">
                        <label>Você tem ou já teve algum transtorno mental?</label>
                        <select name="" id="">
                            <option value="#">Selecione uma das opções</option>
                            <option value="0">Sim</option>
                            <option value="1">Não</option>
                        </select>
                    </div>

                    <div class="input-group">
                        <label>Se sim, qual?</label>
                        <select name="" id="">
                            <option value="#">Selecione uma das opções</option>
                            <option value="Ansiedade">Ansiedade</option>
                            <option value="Depressão">Depressão</option>
                            <option value="TEA">Transtorno do Espectro Autista(TEA)</option>
                            <option value="TEPT"> Transtorno de Estresse pós traumático (TEPT)</option>
                            <option value="Outros">Outros</option>
                        </select>
                    </div>
                    <div>
                        <label>Você sentre que ele te ajudou a passar por crises ou momentos dificeis?</label>
                        <select name="" id="">
                            <option value="#">Selecione uma das opções</option>
                            <option value="0">Sim</option>
                            <option value="1">Não</option>
                        </select>
                    </div>

                    <div class="input-group">
                        <label>Se sim, como ele te ajudou?</label>
                        <input type="text" id="ipt_descricao" placeholder="Responda aqui!">
                    </div>
                    
                    <div>
                        <label>Qual a espécie do seu pet?</label>
                        <select name="" id="">
                            <option value="#">Selecione uma das opções</option>
                            <option value="0">Cachorro</option>
                            <option value="1">Gato</option>
                        </select>
                    </div>

                    <div>
                        <label>Qual a raça do seu pet?</label>
                        <select name="" id="">
                        <option value="">Selecione uma das opções</option>
                        </select>
                    </div>

                    <a href="dashboard.html">
                        <button type="button" class="btn-login">Cadastrar</button>
                    </a>
                </form>
            </div>
        </section>
    </div>
</body>
</html>
