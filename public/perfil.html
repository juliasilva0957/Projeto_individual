<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SoulPaws - Perfil</title>
    <link rel="stylesheet" href="style/perfil.css">
    <link rel="icon" href="assets/logo/Soul (1).png">
</head>

<body onload="carregarNome()">
    <div class="logo">
        <img src="assets/logo/Soul.png" alt="Logo SoulPaws">
    </div>
    <header>
        <nav class="navbar">
            <div class="left">
                <a href="forum.html">FORUM</a>
                <a href="diarioEmocoes.html">EMOÇÕES</a>
                <a href="perfil.html" class="ativo">PERFIL</a>
                <a href="dashboard.html">DASHBOARD</a>
                <a href="index.html">SAIR</a>

            </div>
        </nav>
    </header>

    <main class="principal-perfil">
        <h2 class="titulo-perfil" id="h2_saudacao"></h2>

        <div class="linha-cards">

            <div class="card-perfil">
                <p class="info-perfil" id="p_nome"></p>
                <p class="info-perfil" id="p_email">:</p>
                <p class="info-perfil" id="p_transtorno"></p>
            </div>

            <div class="card-perfil">
                <p class="info-perfil" id="p_sente"></p>
                <p class="info-perfil" id="p_como"></p>
            </div>

        </div>

    </main>
</body>
<script>
        function carregarNome() {
        let idUsuario = localStorage.getItem("idUsuario")
        fetch(`http://localhost:3333/perfil/${idUsuario}`, {
            method: 'GET',
            headers: {
                'Content-Type': 'application/json'
            }

        })
            .then(res => res.json())
            .then(data => {
                h2_saudacao.innerHTML = `Olá, ${data[0].nome}!<br>bem-vindo ao seu<br>perfil!`
                p_nome.innerHTML = `Nome completo: ${data[0].nome}`
                p_email.innerHTML = `Email: ${data[0].email}`
                p_transtorno.innerHTML = `Transtorno mental cadastrado: ${data[0].transtornoMental}`
                p_sente.innerHTML = `Você sente que ele te ajudou a passar por crises ou momentos difíceis? <br>  ${data[0].momentosDificeis}`
                p_como.innerHTML = `Se sim, como? ${data[0].comoAjudou}`

            })
            .catch(error => console.error('Erro:', error));
    }
</script>

</html>
