<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SoulPaws - Perfil</title>
    <link rel="stylesheet" href="style/perfil.css">
    <link rel="icon" href="assets/logo/Soul (1).png">
</head>

<body onload="carregarNome()">
    <div class="logo">
        <img src="assets/logo/Soul.png" alt="Logo SoulPaws">
    </div>
    <header>
        <nav class="navbar">
            <div class="left">
                <a href="forum.html">FORUM</a>
                <a href="diarioEmocoes.html">EMOÇÕES</a>
                <a href="perfil.html">PERFIL</a>
                <a href="dashboard.html">DASHBOARD</a>
                <a href="index.html">SAIR</a>

            </div>
        </nav>
    </header>

    <main class="principal-perfil">
        <h2 class="titulo-perfil" id="h2_saudacao"></h2>

        <div class="linha-cards">

            <div class="card-perfil">
                <p class="info-perfil">Nome completo:</p>
                <p class="info-perfil">Email:</p>
                <p class="info-perfil">Já tem ou teve transtorno mental?<br>[resposta do form de cadastro]</p>
                <p class="info-perfil">Se sim, qual?</p>
            </div>

            <div class="card-perfil">
                <p class="info-perfil">Você sente que ele te ajudou a passar por crises ou momentos difíceis?</p>
                <p class="info-perfil">Se sim, como ele te ajudou?</p>
            </div>

        </div>

    </main>
</body>
<script>
        function carregarNome() {
        let idUsuario = localStorage.getItem("idUsuario")
        fetch(`http://localhost:3333/diario/listar/${idUsuario}`, {
            method: 'GET',
            headers: {
                'Content-Type': 'application/json'
            }

        })
            .then(res => res.json())
            .then(data => {
                p_saudacao.innerHTML = `Olá, ${data[0].nome}!<br>bem-vindo ao seu<br>perfil!`
            })
            .catch(error => console.error('Erro:', error));
    }
</script>

</html>
