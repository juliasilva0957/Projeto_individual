<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SoulPaws - Forum</title>
    <link rel="stylesheet" href="style/forum.css">
    <link rel="icon" href="assets/logo/Soul (1).png">
</head>

<body onload="carregarNome() ; carregarPosts()">
    <div class="logo">
        <img src="assets/logo/Soul.png" alt="Logo SoulPaws">
    </div>
    <header>
        <nav class="navbar">
            <div class="left">
                <a href="forum.html" class="ativo">FORUM</a>
                <a href="diarioEmocoes.html">DIARIO DE EMOÇÕES</a>
                <a href="perfil.html">PERFIL</a>
                <a href="dashboard.html">DASHBOARD</a>
                <a href="index.html">
                    <button class="botao">SAIR</button></a>

            </div>
        </nav>
    </header>

    <main class="principal">
        <p class="saudacao" id="p_saudacao"></p>
        <div class="linha-subtitulo">
            <h2 class="subtitulo">O que gostaria de compartilhar hoje?</h2>
            <a href="novoPost.html">
                <button class="botao-novo-post">+ Novo post</button>
            </a>
        </div>

        <div class="filtros">
            <input type="date" class="botao-filtro" id="ipt_filtro">
            <button class="botao" onclick="filtrarPosts()">FILTRAR POSTAGENS</button>
        </div>

        <div class="container-postagens" id="container-postagens">
        </div>

    </main>
</body>
<script>
    function carregarNome() {
        let idUsuario = localStorage.getItem("idUsuario")
        fetch(`/diario/listar/${idUsuario}`, {
            method: 'GET',
            headers: {
                'Content-Type': 'application/json'
            }

        })
            .then(res => res.json())
            .then(data => {
                p_saudacao.innerHTML = `Olá, ${data[0].nome}!`
            })
            .catch(error => console.error('Erro:', error));
    }

    function abrirPostagem(idPost) {
        sessionStorage.setItem("idPost", idPost);
        window.location.href = "postagem.html";
    }

    function carregarPosts() { /*carrega os posts do forum*/
        fetch(`/forum`, {
            method: 'GET',
            headers: { 'Content-Type': 'application/json' }
        })
            .then(res => res.json())
            .then(posts => {
                let container = document.getElementById('container-postagens');
                container.innerHTML = ''
                if (posts.length == 0) { /*se não houver nenhuma postagem no forum, essa mensagem irá aparecer*/
                    container.innerHTML = `<p style="text-align:center; color: #333;">Nenhuma postagem encontrada.</p>`
                } else { /*se não, roda até aparecer todos os pposts feitos*/

                    for (let i = 0; i < posts.length; i++) {
                        let post = posts[i];
                        container.innerHTML += `
                    <a class="item-postagem" onclick="abrirPostagem(${post.idPostagem})">
                    <span class="titulo-postagem">${post.titulo} -  ${post.dtPostagem}</span>
                    </a>
          `
                    }
                }
            })
            .catch(error => console.error('Erro:', error))
    }

    function filtrarPosts() { /*filtro por data*/
        let dtPostagem = ipt_filtro.value;

        let dados = {
            dtPostagem: dtPostagem
        }

        console.log(`dados: ${dados}`)

        fetch(`/forum/filtrar`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(dados)
        })
            .then(res => res.json())
            .then(posts => {
                let container = document.getElementById('container-postagens');
                container.innerHTML = ''
                if (posts.length === 0) { /*se nenhuma postagem naquela data for encontrado*/
                    container.innerHTML = `<p style="text-align:center; color: #333;">Nenhuma postagem encontrada para esta data.</p>`
                } else if (posts.length == 1) {
                    container.innerHTML += `
                <a class="item-postagem" onclick="abrirPostagem(${posts[0].idPostagem})">
                <span class="titulo-postagem">${posts[0].titulo}  - ${posts[0].dtPostagem}</span>
                </a>`
                } else {
                    for (let i = 0; i < posts.length; i++) {
                        let post = posts[i];

                        container.innerHTML += `
                <a class="item-postagem" onclick="abrirPostagem(${post.idPostagem})">
            <span class="nome-autor-post">${post.nomeUsuario}</span>
            <span class="titulo-postagem">${post.titulo} - ${post.dtPostagem}</span>
                 </a>
    `;
                    }
                }


            })
            .catch(error => console.error('Erro:', error))
    }
</script>

</html>
