<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SoulPaws - Novo post</title>
    <link rel="stylesheet" href="/style/novoPost.css">
    <link rel="icon" href="/assets/logo/Soul (1).png">
</head>

<body>
    <div class="logo">
        <img src="/assets/logo/Soul.png" alt="Logo SoulPaws">
    </div>
    <header>
        <nav class="navbar">
            <div class="left">
                <a href="forum.html" class="ativo">FORUM</a>
                <a href="diarioEmocoes.html">DIARIO DE EMOÇÕES</a>
                <a href="perfil.html">PERFIL</a>
                <a href="dashboard.html">DASHBOARD</a>
                <a href="index.html">SAIR</a>

            </div>
        </nav>
    </header>
    <main class="principal-post">

        <div class="linha-formulario">

            <div class="container-formulario">

                <div class="campo">
                    <label class="rotulo">Titulo da postagem</label>
                    <textarea type="text" class="entrada-texto" id="titulo"></textarea>
                </div>

                <div class="campo">
                    <label class="rotulo">Descrição da postagem</label>
                    <textarea class="area-texto" id="post"></textarea>
                </div>

            </div>

            <button class="botao-postar" onclick="criarPost()">POSTAR</button>

        </div>

    </main>
</body>
<script>
    function criarPost(idPost) {
        let idUsuario = sessionStorage.getItem("idUsuario");
        let titulo = document.getElementById('titulo').value;
        let post = document.getElementById('post').value;

        if (titulo == "" || post == "") {
            alert("Digite valores válidos nos campos")
        } else {

            let dados = {
                    titulo: titulo,
                    post: post,
                    fkUsuario: idUsuario,
                    fkComentario: idPost
            }
            fetch('/novoPost', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(dados)
            })
                .then(res => res.json())
                .then(data => {
                    alert("Post criado com sucesso!");
                    window.location.href = idPost ? `postagem.html?id=${idPost}` : `forum.html`;
                })
                .catch(error => console.error('Erro:', error));
        }
    }
</script>

</html>
