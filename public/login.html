<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SoulPaws - Login</title>
    <link rel="stylesheet" href="style/login.css">
    <link rel="icon" href="assets/logo/Soul (1).png">
</head>

<body>
    <div class="main-container">
        <section class="banner-side">
            <div class="banner-content">
                <h1>Seja bem-vindo(a) <br> de volta!</h1>
            </div>
        </section>

        <section class="form-side">
            <div class="form-box">
                <a href="index.html">
                    <div class="logo">
                        <img src="assets/logo/Soul (1).png" alt="">
                    </div>
                </a>
                <h2>Estamos felizes em <br>ter você por aqui!</h2>
                <form>
                    <div class="input-group">
                        <label>Nome de usuario</label>
                        <input type="text" id="ipt_nome" placeholder="Insira seu nome de usuário">
                    </div>

                    <div class="input-group">
                        <label>Senha</label>
                        <div class="olho">
                                <input type="password" id="ipt_senha" >
                                <span onclick="visualizar()" style="cursor: pointer;">
                                <img id="olho" src="/assets/icons/eye.png"></span> 
                            </div>
                    </div>

                    <button type="button" class="btn-login" onclick="login()">Entrar</button>
                </form>

            </div>
        </section>
    </div>

</body>
<script>
    function visualizar() {
        if (ipt_senha.type == 'password') {
            ipt_senha.type = 'text'
        } else {
            ipt_senha.type = 'password'
        }
    }
    function login() {
        let nomeUsuario = ipt_nome.value;
        let senha = ipt_senha.value;

        if(nomeUsuario == "" || senha == ""){
            alert("Insira dados nos campos")
        } else {

        let dados = {
            nomeUsuario: nomeUsuario,
            senha: senha
        }

        fetch('http://localhost:3333/usuarios/login', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(dados)
        })
            .then(res => res.json())
            .then(data => {
                localStorage.setItem("idUsuario", data[0].idUsuario)
                alert(`Olá ${data[0].nomeUsuario}`)
                window.location.href = "dashboard.html"
            })
            .catch(error => console.error('Erro:', error));
    }
}

</script>

</html>
