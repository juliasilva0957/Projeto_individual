<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SoulPaws - Login</title>
    <link rel="stylesheet" href="/public/style/login.css">
    <link rel="icon" href="assets/logo/Soul (1).png">
</head>
<body>
   <div class="main-container">
        <section class="banner-side">
            <div class="banner-content">
                <h1>Seja bem-vindo(a) <br> de volta!</h1>
            </div>
        </section>

        <section class="form-side">
            <div class="form-box">
                <a href="index.html">
                    <div class="logo">
                      <img src="/public/assets/logo/Soul (1).png" alt="">
                    </div>
                </a>
                <h2>Estamos felizes em <br>ter você por aqui!</h2>
                <form>
                    <div class="input-group">
                        <label>Nome de usuário</label>
                        <input type="email" id="input_email" placeholder="Insira seu nome de usuário">
                    </div>

                    <div class="input-group">
                        <label>Senha</label>
                        <input type="password" id="input_senha" placeholder="*******">
                    </div>

                    <p class="signup-text">Esqueceu a senha?</p>
                    <button type="button" class="btn-login" onclick="login()">Entrar</button>
                </form>

            </div>
        </section>
    </div>

</body>
</html>
    
</body>
</html>
