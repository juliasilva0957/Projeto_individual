<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SoulPaws - Login</title>
    <link rel="stylesheet" href="style/login.css">
    <link rel="icon" href="assets/logo/Soul (1).png">
</head>

<body>
    <div class="container">
        <section class="banner">
            <div class="banner-conteudo">
                <h1>Seja bem-vindo(a) <br> de volta!</h1>
            </div>
        </section>

        <section class="form">
            <div class="form-caixa">
                <a href="index.html">
                    <div class="logo">
                        <img src="assets/logo/Soul (1).png" alt="">
                    </div>
                </a>
                <h2>Estamos felizes em <br>ter você por aqui!</h2>
                <form>
                    <div class="input-grupo">
                        <label for="ipt_login">Nome de usuario ou email</label>
                        <input type="text" id="ipt_login" placeholder="Insira seu nome de usuário ou o email cadastrado">
                    </div>

                    <div class="input-grupo">
                        <label for="ipt_senha">Senha</label>
                        <div class="olho">
                                <input type="password" id="ipt_senha" >
                                <span onclick="visualizar()" style="cursor: pointer;">
                                <img id="olho" src="/assets/icons/eye.png"></span> 
                            </div>
                    </div>

                    <button type="button" class="btn-login" onclick="login()">Entrar</button>
                </form>
                    
            </div>
        </section>
    </div>

        <div id="modal_alerta" class="modal-container">
        <div id="modal_caixa" class="modal-conteudo">
            <h3 id="modal_titulo"></h3>
            <p id="modal_mensagem"></p>
            <button id="modal_botao" class="modal-btn" onclick="fecharModal()">OK</button>
        </div>
    </div>
</body>
<script>

    let redirecionar = false
    function visualizar() {
        if (ipt_senha.type == 'password') {
            ipt_senha.type = 'text'
        } else {
            ipt_senha.type = 'password'
        }
    }

    function exibirModal(titulo, mensagem, tipo) {
        let modal = document.getElementById('modal_alerta');
        let caixa = document.getElementById('modal_caixa');
        
        document.getElementById('modal_titulo').innerHTML = titulo;
        document.getElementById('modal_mensagem').innerHTML = mensagem;
        
        if (tipo === 'sucesso') {
            caixa.style.display = 'flex'; /*mostra o modal na tela*/
            caixa.style.backgroundColor = 'green'
            redirecionar = true;
        } else {
            caixa.style.display = 'flex';
            caixa.style.backgroundColor = 'red'
            redirecionar = false;
        }

        modal.style.display = 'flex'; /*faz com que o modal apareça mesmo se o login for true ou false*/
    }

    function fecharModal() {
        document.getElementById('modal_alerta').style.display = 'none';
        if (redirecionar) { /*se o redirecionar for true, manda o usuario para a dash*/
            window.location.href = "dashboard.html";
        }
    }

    function login() {
        let login = ipt_login.value;
        let senha = ipt_senha.value;

        if(login == "" || senha == ""){
            alert("Insira dados nos campos")
        } else {

        let dados = {
            login: login,
            senha: senha
        }

        fetch('/usuarios/login', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(dados)
        })
           .then(res => {
            if (res.ok) {
                return res.json();
            } else {
                return null; 
            }
        })
        .then(data => {
            if (data != null && data.length > 0) {
                sessionStorage.setItem("idUsuario", data[0].idUsuario);
                exibirModal("Bem-vindo!", `Olá, ${data[0].nomeUsuario}! Login realizado com sucesso.`, 'sucesso');
            } else {
                exibirModal("Falha no Login", "Usuário/E-mail ou senha incorretos. Tente novamente.", 'erro');
            }
        })
        .catch(error => {
            console.error("Erro de conexão:", error);
            exibirModal("Erro de Conexão", "Não foi possível conectar ao servidor. Tente novamente mais tarde.", 'erro');
        });
    }
}

</script>

</html>
