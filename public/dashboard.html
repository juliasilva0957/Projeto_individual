<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SoulPaws - Dashboard</title>
  <link rel="stylesheet" href="style/dashboard.css">
  <link rel="icon" href="assets/logo/Soul (1).png">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body onload="carregarDashboard()">
  <div class="logo">
    <img src="assets/logo/Soul.png" alt="Logo SoulPaws">
  </div>
  <header>
    <nav class="navbar">
      <div class="left">
        <a href="forum.html">FORUM</a>
        <a href="diarioEmocoes.html">DIARIO DE EMOÇÕES</a>
        <a href="perfil.html">PERFIL</a>
        <a href="dashboard.html" class="ativo">DASHBOARD</a>
        <a href="index.html">
          <button class="botao">SAIR</button>
        </a>

      </div>
    </nav>
  </header>
  <div class="dashboard">
    <p class="saudacao" id="p_saudacao"></p>
    <div class="col-left">
      <div class="line-card">
        <div class="card-title">Seu nível de atividade no fórum no mês</div>
        <div class="chart-wrapper">
          <canvas id="lineChart"></canvas>
        </div>
      </div>
    </div>


    <div class="col-right-top">
      <div class="stats-row">
        <div class="stat-card pink">
          <span class="stat-label">Total de posts que você fez no mês</span>
          <span class="stat-value" id="totalPost"></span>
        </div>
        <div class="stat-card orange">
          <span class="stat-label">Total de dias você interagiu no fórum durante o mês</span>
          <span class="stat-value" id="diasConsecutivos"></span>
        </div>
      </div>


      <div class="card donut-card">
        <div class="card-title" id="tituloRaca"></div>
        <div class="donut-wrapper">
          <canvas id="donutChart"></canvas>
          <div class="donut-label" id="donutPorcentagem"></div>
        </div>
        <div class="donut-legend" id="donutLegenda">
          <div><span class="dot filled"></span></div>
          <div><span class="dot empty"></span></div>
        </div>
      </div>
    </div>

    <div class="card bar-card">
      <div class="card-title">Emoções que você mais relatou no mês</div>
      <div class="bar-wrapper">
        <canvas id="barChart"></canvas>
      </div>
    </div>

  </div>

  <script>

    let graficoDeLinha = null;
    let graficoDeBarras = null


    function carregarDashboard() {
      carregarNome();
      carregarKpi();
      carregarAtividadeForum();
      carregarPorcentagemRaca();
      carregarEmocoes();
    }

    function carregarNome() {
      let idUsuario = sessionStorage.getItem("idUsuario");

      fetch(`/diario/listar/${idUsuario}`)
        .then(res => res.json())
        .then(data => {
          p_saudacao.innerHTML = `Olá, ${data[0].nome}!`;
        })
        .catch(erro => console.error(erro));
    }

    function carregarKpi() {
      let idUsuario = sessionStorage.getItem("idUsuario");

      fetch(`/dashboard/kpis/${idUsuario}`)
        .then(res => res.json())
        .then(data => {
          document.getElementById("totalPost").innerHTML = `${data.totalPostsMes} posts`;
          document.getElementById("diasConsecutivos").innerHTML = `${data.diasInteragidos} dias`;
        })
        .catch(erro => console.error(erro));
    }

    function carregarAtividadeForum() {
      let idUsuario = sessionStorage.getItem("idUsuario");

      fetch(`/dashboard/atividade/${idUsuario}`)
        .then(res => res.json())
        .then(data => {
          let dias = [];
          let posts = [];
          let comentarios = [];

          for (let i = 0; i < data.length; i++) {
            dias.push(data[i].dia);
            posts.push(data[i].posts);
            comentarios.push(data[i].comentarios);
          }

          graficoDeLinha = new Chart(document.getElementById('lineChart'), {
            type: 'line',
            data: {
              labels: dias,
              datasets: [
                {
                  label: 'Post',
                  data: posts,
                  borderColor: '#ff7a00',
                  backgroundColor: 'transparent',
                  borderWidth: 3,
                  pointBackgroundColor: '#ff7a00',
                  pointRadius: 5,
                  tension: 0.35
                },
                {
                  label: 'Comentários',
                  data: comentarios,
                  borderColor: '#ff1251',
                  backgroundColor: 'transparent',
                  borderWidth: 3,
                  pointBackgroundColor: '#ff1251',
                  pointRadius: 5,
                  tension: 0.35
                }
              ]
            }, options: {
              responsive: true,
              maintainAspectRatio: false,

              plugins: {
                legend: {
                  labels: {
                    color: '#33333',
                    font: {
                      size: 13,
                    }
                  }
                }
              },

              scales: {

                x: {
                  title: {
                    display: true,
                    text: 'Dias do mês',
                    color: '#333333',

                    font: {
                      size: 14,
                    }
                  },

                  ticks: {
                    color: '#333333'
                  },

                  grid: {
                    color: 'rgba(0,0,0,0.08)'
                  }
                },

                y: {
                  beginAtZero: true,

                  title: {
                    display: true,
                    text: 'Quantidade',
                    color: '#333333',

                    font: {
                      size: 14,
                    }
                  },
                  ticks: {
                    stepSize: 1,
                    color: '#333333'
                  },
                  grid: {
                    color: 'rgba(255,255,255,0.08)'
                  }
                }
              }
            }
          });
        })
        .catch(erro => console.error(erro));
    }

    function carregarPorcentagemRaca() {
      let idUsuario = sessionStorage.getItem("idUsuario");

      fetch(`/dashboard/raca/${idUsuario}`)
        .then(res => res.json())
        .then(data => {
          let porcentagem = Number(data.porcentagem);
          let restante = 100 - porcentagem;

          document.getElementById("donutPorcentagem").innerHTML = `${porcentagem}%`;

          document.getElementById('donutLegenda').innerHTML = `
          <div><span class="dot filled"></span>Cerca de ${porcentagem}% dos usuários possuem ${data.racaUsuario}</div>
          <div><span class="dot empty"></span>Os outros ${restante}% possuem raças diferentes</div>
        `;
          document.getElementById('tituloRaca').innerHTML = `Porcentagem de usuários que também possuem ${data.racaUsuario} como pet!`;

          new Chart(document.getElementById('donutChart'), {
            type: 'doughnut',
            data: {
              datasets: [{
                data: [porcentagem, restante],
                backgroundColor: ['#ff1251', '#ffd6df'],
                borderWidth: 0,
                hoverOffset: 4
              }]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              cutout: '72%',
              plugins: {
                legend: { display: false },
                tooltip: { enabled: false }
              }
            }
          });
        })
        .catch(erro => console.error(erro));
    }

    function carregarEmocoes() {
      let idUsuario = sessionStorage.getItem("idUsuario");

      fetch(`/dashboard/emocoes/${idUsuario}`)
        .then(res => res.json())
        .then(data => {
          let emocoes = [];
          let quantidades = [];

          for (let i = 0; i < data.length; i++) {
            emocoes.push(data[i].nomeEmocao);
            quantidades.push(data[i].quantidade);
          }

          graficoDeBarras = new Chart(document.getElementById('barChart'), {
            type: 'bar',
            data: {
              labels: emocoes,
              datasets: [{
                data: quantidades,
                backgroundColor: '#ff1251',
                borderRadius: 8,
                borderSkipped: false
              }]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: {
                legend: {
                  display: false
                }
              },
              scales: {
                x: {
                  title: {
                    display: true,
                    text: 'Emoções relatadas',
                    font: {
                      size: 12,
                      weight: 'bold'
                    }
                  },
                  grid: { display: false }
                },
                y: {
                  beginAtZero: true,
                  title: {
                    display: true,
                    text: 'Quantidade',
                    font: {
                      size: 12,
                      weight: 'bold'
                    }
                  },
                  ticks: {
                    stepSize: 1
                  }
                }
              }
            }
          });
        })
        .catch(erro => console.error(erro));
    }
  </script>

</body>

</html>
