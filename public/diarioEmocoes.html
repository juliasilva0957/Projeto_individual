<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SoulPaws - Diario de emoções</title>
    <link rel="stylesheet" href="style/diarioEmocoes.css">
    <link rel="icon" href="/assets/logo/Soul (1).png">
</head>

<body onload="iniciar()">
    <div class="logo">
        <img src="assets/logo/Soul.png" alt="Logo SoulPaws">
    </div>
    <header>
        <nav class="navbar">
            <div class="left">
                <a href="forum.html">FORUM</a>
                <a href="diarioEmocoes.html" class="ativ" >EMOÇÕES</a>
                <a href="perfil.html">PERFIL</a>
                <a href="dashboard.html">DASHBOARD</a>
                <a href="index.html">SAIR</a>

            </div>
        </nav>
    </header>
    <main class="principal-emocoes">
        <h2 class="titulo-emocoes" id="h2_saudacao"></h2>
        <div class="linha-botoes-emocoes">
            <select class="selecionar-emocao" id="select_emocoes">
                <option value="" selected>SELECIONE A EMOÇÃO AQUI</option>
                <option value="feliz">Feliz</option>
                <option value="triste">Triste</option>
                <option value="ansioso">Ansioso</option>
                <option value="calmo">Calmo</option>
                <option value="estressado">Estressado</option>
                <option value="grato">Grato</option>
                <option value="solitario">Solitário</option>
                <option value="animado">Animado</option>
            </select>
            <button onclick="publicar()" class="botao-registro">+ REGISTRAR EMOÇÃO</button>
        </div>
        <div class="campo-emocao">
            <div class="rotulo-emocao" id="descricao">Descreva como está se sentindo</div>
            <textarea class="area-emocao" id="txt_emocao"></textarea>
        </div>

    </main>
</body>

</html>
<script>
    function iniciar() {
        let idUsuario = localStorage.getItem("idUsuario")
        fetch(`http://localhost:3333/diario/listar/${idUsuario}`, {
            method: 'GET',
            headers: {
                'Content-Type': 'application/json'
            }
            
        })
            .then(res => res.json())
            .then(data => {
                h2_saudacao.innerHTML = `Como você está se sentindo hoje, ${data[0].nome}?`
            })
            .catch(error => console.error('Erro:', error));





    }
    function publicar() {
        let selectEmocoes = select_emocoes.value;
        let descrevaEmocao = txt_emocao.value
        let idUsuario = localStorage.getItem("idUsuario")


        let dados = {
            descricao: descrevaEmocao,
            selecionar: selectEmocoes
        }

        fetch(`http://localhost:3333/diario/publicar/${idUsuario}`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(dados)
        })
            .then(res => res.json())
            .then(data => {
                // localStorage.setItem("idUsuario", data[0].idUsuario)
                // alert(`Olá ${data[0].nomeUsuario}`)
                // window.location.href = "/public/dashboard.html"
            })
            .catch(error => console.error('Erro:', error));

    }
</script>
